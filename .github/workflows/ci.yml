name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -q

      - name: Verify imports
        run: |
          python -c "from src.core.magnitude import estimate_local_magnitude, MagnitudeResult; print('magnitude OK')"
          python -c "from src.core.magnitude_backup import estimate_local_magnitude_wa; print('magnitude_backup OK')"
          python -c "from src.ai_agent.earthquake_search import EarthquakeSearcher, EarthquakeQuery, correlacion_catalogo_picks; print('earthquake_search OK')"
          python -c "from src.cli import process_file; print('CLI OK')"
          python -c "from src.server import app; print('Server OK')"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install flake8
      - name: Lint with flake8
        run: flake8 src/ --count --max-complexity=15 --max-line-length=140 --statistics

  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: seismoanalyzer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-pages:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
